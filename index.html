<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Uzun Hikaye | Cafe & Bistro Dijital Menü</title>
  <meta name="theme-color" content="#2A0E10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #9B2226;
      --primary-dark: #7A191D;
      --primary-hover-bg: #F5D5D7;
      --primary-soft: #FCEAEA;
      --primary-border: #9B2226;

      --maps-green: #1E8E3E;
      --maps-green-dark: #137333;

      --bg-page: #FAF8F5;
      --bg-card: #FFFFFF;
      --text-main: #1F1A1A;
      --text-muted: #6E6565;
      --border-light: #EFEAE6;

      --shadow-sm: 0 2px 10px rgba(31, 26, 26, 0.04);
      --shadow-hover: 0 12px 26px rgba(155, 34, 38, 0.16);
      --radius-lg: 18px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Dokunarak Açılan Animasyonlu Sayfa Kapağı */
    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #4A1418 0%, #240B0D 70%, #160607 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #FFFFFF;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s ease;
    }

    #splashScreen.hidden {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      overflow: hidden;
      animation: floatLogo 2.4s ease-in-out infinite alternate;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .splash-logo svg {
      width: 112px;
      height: 112px;
      object-fit: contain;
    }

    .splash-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .splash-sub {
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #F6C5C7;
      margin-bottom: 36px;
    }

    .splash-tap-hint {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #FFFFFF;
      animation: tapPulse 1.8s ease-in-out infinite;
    }

    .splash-tap-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F6C5C7;
      box-shadow: 0 0 10px #F6C5C7;
    }

    @keyframes floatLogo {
      from { transform: translateY(0px) scale(0.98); }
      to { transform: translateY(-7px) scale(1.02); }
    }

    @keyframes tapPulse {
      0%, 100% { transform: scale(1); opacity: 0.88; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    /* Üst Başlık (Hero Header) */
    .hero {
      background: radial-gradient(circle at top right, #4E161B 0%, #240B0D 65%, #190708 100%);
      color: #FFFFFF;
      padding: 28px 20px 30px;
      text-align: center;
      position: relative;
    }

    .hero-inner {
      max-width: 780px;
      margin: 0 auto;
    }

    .brand-logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-logo svg {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    .brand-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #F6C5C7;
      background: rgba(155, 34, 38, 0.35);
      border: 1px solid rgba(246, 197, 199, 0.25);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 8px;
    }

    .brand-name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .brand-meta {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-bottom: 18px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      background-color: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.26);
      backdrop-filter: blur(6px);
      transition: background-color 0.55s ease, border-color 0.55s ease, transform 0.35s ease, box-shadow 0.55s ease;
    }

    .hero-btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* Haritada Gör Butonu: Üzerine gelindiğinde / telefonda dokunulduğunda yavaşça Google Maps yeşili olur */
    .btn-maps:hover,
    .btn-maps:focus-visible,
    .btn-maps.touch-green {
      background-color: var(--maps-green);
      border-color: var(--maps-green);
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(30, 142, 62, 0.48);
    }

    .btn-instagram:hover,
    .btn-instagram:active {
      background-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    /* Sabitlenen Arama ve Kategori Alanı (Üst kısımdan ayrılmış, ferah konumlu) */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 248, 245, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 16px 12px;
    }

    .controls-inner {
      max-width: 780px;
      margin: 0 auto;
    }

    .search-wrap {
      position: relative;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--primary);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      padding: 13px 42px 13px 46px;
      border: 1px solid #E5DDD8;
      border-radius: var(--radius-pill);
      background: #FFFFFF;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      box-shadow: 0 4px 14px rgba(31, 26, 26, 0.05);
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    #searchInput:focus {
      border-color: var(--primary);
      box-shadow: 0 6px 20px rgba(155, 34, 38, 0.13);
    }

    #clearSearchBtn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: #F1ECE9;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #clearSearchBtn.visible {
      display: flex;
    }

    /* Kategori Barı (Filtre değil, yumuşak sayfa içi yönlendirme) */
    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-bar::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      flex: 0 0 auto;
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid #E5DDD8;
      background: #FFFFFF;
      color: #3E3535;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease, transform 0.2s ease;
    }

    .category-btn:hover,
    .category-btn.jump-flash {
      border-color: var(--primary);
      background: var(--primary-hover-bg);
      color: var(--primary-dark);
    }

    .category-btn:active {
      transform: scale(0.96);
    }

    /* "Tümü" butonu her zaman seçili kalır */
    .category-btn.always-all {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(155, 34, 38, 0.26);
    }

    .category-btn.always-all:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      color: #FFFFFF;
    }

    /* Ana Menü Container */
    .menu-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    .category-section {
      margin-bottom: 34px;
      scroll-margin-top: 142px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .category-accent {
      width: 4px;
      height: 24px;
      border-radius: 4px;
      background: var(--primary);
      flex-shrink: 0;
    }

    .category-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.48rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    .category-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, #E2D9D4, transparent);
    }

    /* Ürün Kartları */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .product-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: background-color 0.55s ease, border-color 0.55s ease, transform 0.35s ease, box-shadow 0.55s ease;
    }

    /* Ürün Kartı Üzerine Gelince veya Telefonda Dokunulunca Yavaşça Bordomsu Renge Bürünür */
    .product-card:hover,
    .product-card.touch-bordeaux {
      background-color: var(--primary-hover-bg);
      border-color: var(--primary-border);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .product-card:hover .product-title,
    .product-card.touch-bordeaux .product-title {
      color: var(--primary-dark);
    }

    .product-card:hover .product-desc,
    .product-card.touch-bordeaux .product-desc {
      color: #4D3B3C;
    }

    .product-card:hover .product-price,
    .product-card.touch-bordeaux .product-price {
      background-color: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .product-card:hover .product-img,
    .product-card.touch-bordeaux .product-img {
      transform: scale(1.05);
    }

    .product-card.sold-out {
      opacity: 0.62;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .product-title {
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--text-main);
      transition: color 0.45s ease;
    }

    .product-tag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 9px;
      border-radius: 7px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid rgba(155, 34, 38, 0.22);
    }

    .product-tag.sold-out-tag {
      background: #EFEFEF;
      color: #666666;
      border-color: #DCDCDC;
    }

    .product-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.45s ease;
    }

    .product-price {
      display: inline-block;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid rgba(155, 34, 38, 0.14);
      padding: 5px 12px;
      border-radius: 10px;
      transition: background-color 0.45s ease, color 0.45s ease, border-color 0.45s ease;
    }

    .product-img-wrap {
      width: 96px;
      height: 86px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: #F3ECE8;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease;
    }

    /* Durum Mesajları */
    .status-box {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #EBDCDC;
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Ürün Detay Modalı */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(20, 8, 9, 0.62);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
      transform: translateY(16px) scale(0.98);
      transition: transform 0.25s ease;
      position: relative;
    }

    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(25, 10, 11, 0.65);
      color: #FFFFFF;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #F3ECE8;
      display: block;
    }

    .modal-body {
      padding: 20px 22px 24px;
    }

    .modal-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.45rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--primary);
      padding: 7px 16px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 24px 16px 36px;
      font-size: 0.82rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-light);
    }

    @media (max-width: 480px) {
      .brand-name { font-size: 1.8rem; }
      .product-card { padding: 14px; gap: 12px; }
      .product-img-wrap { width: 84px; height: 78px; }
      .category-title { font-size: 1.32rem; }
    }
  </style>
</head>
<body>

  <!-- Dokunarak Açılan Animasyonlu Sayfa Kapağı -->
  <div id="splashScreen" role="button" tabindex="0" aria-label="Menüyü açmak için dokunun">
    <div class="splash-logo" id="splashLogo"></div>
    <div class="splash-title" id="splashTitle">Uzun Hikaye</div>
    <div class="splash-sub" id="splashSub">Cafe & Bistro</div>
    <div class="splash-tap-hint">
      <span class="splash-tap-dot"></span>
      <span>Menüyü açmak için dokunun</span>
    </div>
  </div>

  <!-- Üst Bilgi -->
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-logo" id="headerLogo"></div>
      <div class="brand-badge" id="brandBadge">Cafe & Bistro</div>
      <h1 class="brand-name" id="brandName">Uzun Hikaye</h1>
      <div class="brand-meta">
        <span id="workingHoursText"></span>
        <span id="addressText"></span>
      </div>
      <div class="hero-actions">
        <a id="mapsBtn" class="hero-btn btn-maps" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
          <span>Haritada Gör</span>
        </a>
        <a id="instagramBtn" class="hero-btn btn-instagram" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span id="instagramLabel">uzunhikayekafe</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Arama ve Kategori Çubuğu -->
  <div class="sticky-controls" id="stickyControls">
    <div class="controls-inner">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Menüde ürün veya içerik ara..." autocomplete="off" />
        <button type="button" id="clearSearchBtn" aria-label="Aramayı temizle">×</button>
      </div>
      <nav class="category-bar" id="categoryBar" aria-label="Menü Kategorileri"></nav>
    </div>
  </div>

  <!-- Menü Alanı -->
  <main class="menu-container" id="menuContainer">
    <div class="status-box">
      <div class="spinner"></div>
      <p>Menü yükleniyor...</p>
    </div>
  </main>

  <!-- Ürün Detay Modalı -->
  <div class="modal-overlay" id="productModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button type="button" class="modal-close" id="modalClose" aria-label="Kapat">×</button>
      <img id="modalImg" class="modal-img" src="" alt="" />
      <div class="modal-body">
        <div id="modalTagWrap" style="margin-bottom: 8px;"></div>
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalDesc" class="modal-desc"></p>
        <div class="modal-footer">
          <span id="modalPrice" class="modal-price"></span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span id="footerText">Uzun Hikaye Cafe & Bistro — Afiyet Olsun</span>
  </footer>

  <script>
    // ========================================================
    // UZUN HİKAYE CAFE & BISTRO AYARLARI
    // ========================================================
    const CAFE_CONFIG = {
      sheetUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQYM2keVBFEnXGx6ZPFFtZeOJNlVDxAtiHyxdVnIHjEqoRZwXA6vZGKPI9V9Bx_QYKJMpnI_L3O29IP/pub?output=csv",
      name: "Uzun Hikaye",
      badge: "Cafe & Bistro",
      address: "Köşk, Çevre Sk. No:15 D:13, Melikgazi/Kayseri",
      currency: "₺",
      instagramUser: "uzunhikayekafe",
      googleMapsUrl: "https://www.google.com/maps/search/?api=1&query=K%C3%B6%C5%9Fk+%C3%87evre+Sk.+No:15+D:13+38030+Melikgazi+Kayseri",
      workingHours: "Açılış uyanınca, kapanış sıkılınca 🎉",
      logoUrl: "u.jpg"
    };

    const UZUN_HIKAYE_LOGO_SVG = `
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M26 36 C42 18, 78 18, 94 36" stroke="#9B2226" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M28 86 C45 102, 75 102, 92 86" stroke="#9B2226" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M84 44 C82 39, 87 36, 85 31" stroke="#9B2226" stroke-width="2" stroke-linecap="round"/>
        <path d="M90 46 C88 41, 93 38, 91 33" stroke="#1F1A1A" stroke-width="1.8" stroke-linecap="round"/>
        <text x="56" y="57" text-anchor="middle" fill="#9B2226" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="18.5" letter-spacing="0.4">Uzun</text>
        <text x="62" y="74" text-anchor="middle" fill="#9B2226" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="18.5" letter-spacing="0.4">Hikaye</text>
        <text x="60" y="85" text-anchor="middle" fill="#1F1A1A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="6.8" letter-spacing="1.4">CAFE &amp; BISTRO</text>
      </svg>
    `;

    const FALLBACK_IMG = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=400&q=80";

    let allItems = [];
    let categoryList = [];

    function initBranding() {
      document.title = `${CAFE_CONFIG.name} | ${CAFE_CONFIG.badge} Dijital Menü`;
      document.getElementById("brandName").textContent = CAFE_CONFIG.name;
      document.getElementById("brandBadge").textContent = CAFE_CONFIG.badge;
      document.getElementById("splashTitle").textContent = CAFE_CONFIG.name;
      document.getElementById("splashSub").textContent = CAFE_CONFIG.badge;
      document.getElementById("footerText").textContent = `${CAFE_CONFIG.name} ${CAFE_CONFIG.badge} — Afiyet Olsun`;

      document.getElementById("workingHoursText").textContent = CAFE_CONFIG.workingHours ? `🕒 ${CAFE_CONFIG.workingHours}` : "";
      document.getElementById("addressText").textContent = CAFE_CONFIG.address ? `📍 ${CAFE_CONFIG.address}` : "";

      const mapsBtn = document.getElementById("mapsBtn");
      if (CAFE_CONFIG.googleMapsUrl) {
        mapsBtn.href = CAFE_CONFIG.googleMapsUrl;
      } else {
        mapsBtn.style.display = "none";
      }

      // Telefonda "Haritada Gör" butonuna dokununca yavaşça yeşil animasyonu tetikle
      mapsBtn.addEventListener("touchstart", () => {
        mapsBtn.classList.add("touch-green");
      }, { passive: true });

      mapsBtn.addEventListener("touchend", () => {
        setTimeout(() => mapsBtn.classList.remove("touch-green"), 700);
      }, { passive: true });

      const instaBtn = document.getElementById("instagramBtn");
      const instaLabel = document.getElementById("instagramLabel");
      if (CAFE_CONFIG.instagramUser) {
        const cleanUser = CAFE_CONFIG.instagramUser.replace("@", "");
        instaBtn.href = `https://instagram.com/${cleanUser}`;
        instaLabel.textContent = cleanUser;
      } else {
        instaBtn.style.display = "none";
      }

      const logoHTML = CAFE_CONFIG.logoUrl
        ? `<img src="${CAFE_CONFIG.logoUrl}" alt="${CAFE_CONFIG.name} Logo" />`
        : UZUN_HIKAYE_LOGO_SVG;
      document.getElementById("headerLogo").innerHTML = logoHTML;
      document.getElementById("splashLogo").innerHTML = logoHTML;

      // Kapak ekranı yalnızca kullanıcı dokunduğunda / tıkladığında açılır
      const splash = document.getElementById("splashScreen");
      const dismissSplash = () => {
        splash.classList.add("hidden");
      };
      splash.addEventListener("click", dismissSplash);
      splash.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          dismissSplash();
        }
      });
    }

    function resolveCsvUrl(url) {
      if (!url) return "";
      if (url.includes("output=csv") || url.includes("tqx=out:csv")) {
        return url;
      }
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) {
        return `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:csv`;
      }
      return url;
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      const cleanText = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < cleanText.length; i++) {
        const ch = cleanText[i];
        const next = cleanText[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            row.push(field.trim());
            field = "";
          } else if (ch === "\r" && next === "\n") {
            row.push(field.trim());
            rows.push(row);
            row = [];
            field = "";
            i++;
          } else if (ch === "\n" || ch === "\r") {
            row.push(field.trim());
            rows.push(row);
            row = [];
            field = "";
          } else {
            field += ch;
          }
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        rows.push(row);
      }

      return rows;
    }

    function slugify(str) {
      return "cat-" + str
        .toLowerCase()
        .replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s")
        .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ç/g, "c")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    async function loadMenu() {
      const container = document.getElementById("menuContainer");
      const csvUrl = resolveCsvUrl(CAFE_CONFIG.sheetUrl);

      if (!csvUrl || csvUrl.includes("BURAYA_GOOGLE_TABLO")) {
        container.innerHTML = `
          <div class="status-box">
            <p><strong>Tablo bağlantısı eksik.</strong><br/>Lütfen <code>index.html</code> içindeki <code>sheetUrl</code> alanına Google E-Tablolar <code>.csv</code> linkinizi yapıştırın.</p>
          </div>`;
        return;
      }

      try {
        const response = await fetch(csvUrl, { cache: "no-store" });
        if (!response.ok) throw new Error("Veri alınamadı");
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          container.innerHTML = `<div class="status-box"><p>Menüde henüz ürün bulunmuyor.</p></div>`;
          return;
        }

        const headers = rows[0].map(h => h.toLowerCase().trim());
        const findCol = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(k)));

        const idxCategory = findCol(["kategori"]);
        const idxName = findCol(["ürün", "urun", "ad"]);
        const idxDesc = findCol(["açıklama", "aciklama"]);
        const idxPrice = findCol(["fiyat"]);
        const idxImage = findCol(["görsel", "gorsel", "resim", "foto"]);
        const idxStatus = findCol(["durum"]);
        const idxTag = findCol(["etiket"]);

        allItems = [];
        const catSet = new Set();

        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i];
          const category = (cols[idxCategory] || "").trim();
          const name = (cols[idxName] || "").trim();
          if (!category || !name) continue;

          const status = (cols[idxStatus] || "Aktif").trim().toLowerCase();
          if (status === "pasif" || status === "gizli" || status === "kapalı") continue;

          const item = {
            category,
            name,
            desc: (cols[idxDesc] || "").trim(),
            price: (cols[idxPrice] || "").trim(),
            image: (cols[idxImage] || "").trim(),
            soldOut: status.includes("tükendi") || status.includes("tukendi"),
            tag: (cols[idxTag] || "").trim()
          };

          allItems.push(item);
          catSet.add(category);
        }

        categoryList = Array.from(catSet);
        renderCategories();
        renderMenu("");
      } catch (err) {
        container.innerHTML = `
          <div class="status-box">
            <p>Menü yüklenirken bir sorun oluştu.<br/>Lütfen sayfayı yenileyin veya internet bağlantınızı kontrol edin.</p>
          </div>`;
      }
    }

    // Kategori Çubuğu: "Tümü" seçili kalır, diğerleri filtreleme yapmadan ilgili başlığa yumuşakça kaydırır
    function renderCategories() {
      const bar = document.getElementById("categoryBar");
      bar.innerHTML = "";

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "category-btn always-all";
      allBtn.textContent = "Tümü";
      allBtn.addEventListener("click", () => scrollToCategory("ALL", allBtn));
      bar.appendChild(allBtn);

      categoryList.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-btn";
        btn.textContent = cat;
        btn.addEventListener("click", () => scrollToCategory(slugify(cat), btn));
        bar.appendChild(btn);
      });
    }

    function scrollToCategory(targetId, clickedBtn) {
      const searchInput = document.getElementById("searchInput");

      if (searchInput.value.trim() !== "") {
        searchInput.value = "";
        document.getElementById("clearSearchBtn").classList.remove("visible");
        renderMenu("");
      }

      if (!clickedBtn.classList.contains("always-all")) {
        clickedBtn.classList.add("jump-flash");
        setTimeout(() => clickedBtn.classList.remove("jump-flash"), 450);
      }

      if (targetId === "ALL") {
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const section = document.getElementById(targetId);
      if (section) {
        const stickyHeight = document.getElementById("stickyControls").offsetHeight || 130;
        const targetTop = section.getBoundingClientRect().top + window.pageYOffset - stickyHeight - 10;
        window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
      }
    }

    function renderMenu(searchQuery) {
      const container = document.getElementById("menuContainer");
      const query = (searchQuery || "").toLowerCase().trim();

      const filtered = query
        ? allItems.filter(item =>
            item.name.toLowerCase().includes(query) ||
            item.desc.toLowerCase().includes(query) ||
            item.category.toLowerCase().includes(query) ||
            item.tag.toLowerCase().includes(query)
          )
        : allItems;

      if (!filtered.length) {
        container.innerHTML = `
          <div class="status-box">
            <p>"${searchQuery}" için eşleşen ürün bulunamadı.</p>
          </div>`;
        return;
      }

      const grouped = new Map();
      filtered.forEach(item => {
        if (!grouped.has(item.category)) {
          grouped.set(item.category, []);
        }
        grouped.get(item.category).push(item);
      });

      container.innerHTML = "";

      grouped.forEach((items, categoryName) => {
        const section = document.createElement("section");
        section.className = "category-section";
        section.id = slugify(categoryName);

        section.innerHTML = `
          <div class="category-header">
            <span class="category-accent"></span>
            <h2 class="category-title">${categoryName}</h2>
            <span class="category-line"></span>
          </div>
          <div class="items-list"></div>
        `;

        const listEl = section.querySelector(".items-list");

        items.forEach(item => {
          const card = document.createElement("article");
          card.className = "product-card" + (item.soldOut ? " sold-out" : "");

          const tagHtml = item.soldOut
            ? `<span class="product-tag sold-out-tag">Tükendi</span>`
            : (item.tag ? `<span class="product-tag">${item.tag}</span>` : "");

          const priceText = item.price
            ? (item.price.includes(CAFE_CONFIG.currency) ? item.price : `${item.price} ${CAFE_CONFIG.currency}`)
            : "";

          const imgSrc = item.image || FALLBACK_IMG;

          card.innerHTML = `
            <div class="product-info">
              <div class="product-top">
                <h3 class="product-title">${item.name}</h3>
                ${tagHtml}
              </div>
              ${item.desc ? `<p class="product-desc">${item.desc}</p>` : ""}
              ${priceText ? `<span class="product-price">${priceText}</span>` : ""}
            </div>
            <div class="product-img-wrap">
              <img class="product-img" src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'" />
            </div>
          `;

          // Telefonda ürüne dokunulduğunda yavaş bordomsu renk animasyonunu tetikle
          let touchTimer = null;
          card.addEventListener("touchstart", () => {
            clearTimeout(touchTimer);
            document.querySelectorAll(".product-card.touch-bordeaux").forEach(el => {
              if (el !== card) el.classList.remove("touch-bordeaux");
            });
            card.classList.add("touch-bordeaux");
          }, { passive: true });

          card.addEventListener("touchend", () => {
            touchTimer = setTimeout(() => {
              card.classList.remove("touch-bordeaux");
            }, 650);
          }, { passive: true });

          card.addEventListener("click", () => {
            card.classList.add("touch-bordeaux");
            setTimeout(() => {
              openModal(item, priceText, imgSrc);
              setTimeout(() => card.classList.remove("touch-bordeaux"), 400);
            }, 180);
          });

          listEl.appendChild(card);
        });

        container.appendChild(section);
      });
    }

    function openModal(item, priceText, imgSrc) {
      const modal = document.getElementById("productModal");
      document.getElementById("modalImg").src = imgSrc;
      document.getElementById("modalImg").alt = item.name;
      document.getElementById("modalTitle").textContent = item.name;
      document.getElementById("modalDesc").textContent = item.desc || "Özenle hazırlanmış lezzetimiz.";
      document.getElementById("modalPrice").textContent = priceText || "";

      const tagWrap = document.getElementById("modalTagWrap");
      if (item.soldOut) {
        tagWrap.innerHTML = `<span class="product-tag sold-out-tag">Tükendi</span>`;
      } else if (item.tag) {
        tagWrap.innerHTML = `<span class="product-tag">${item.tag}</span>`;
      } else {
        tagWrap.innerHTML = "";
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      const modal = document.getElementById("productModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("productModal").addEventListener("click", (e) => {
      if (e.target.id === "productModal") closeModal();
    });

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearSearchBtn");

    searchInput.addEventListener("input", (e) => {
      const val = e.target.value;
      clearBtn.classList.toggle("visible", val.trim().length > 0);
      renderMenu(val);
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      clearBtn.classList.remove("visible");
      renderMenu("");
      searchInput.focus();
    });

    initBranding();
    loadMenu();
  </script>
